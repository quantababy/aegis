server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Swagger docs, openapi.json, and healthcheck to backend
    location /docs {
        proxy_pass https://aegis-backend-production-a4f9.up.railway.app/docs;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host aegis-backend-production-a4f9.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass https://aegis-backend-production-a4f9.up.railway.app/openapi.json;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host aegis-backend-production-a4f9.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass https://aegis-backend-production-a4f9.up.railway.app/health;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host aegis-backend-production-a4f9.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy REST API requests to backend
    location /api/ {
        proxy_pass https://aegis-backend-production-a4f9.up.railway.app/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host aegis-backend-production-a4f9.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Proxy OpenAI-compatible proxy requests
    location /v1/ {
        proxy_pass https://aegis-backend-production-a4f9.up.railway.app/v1/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host aegis-backend-production-a4f9.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Proxy SSE event streams without buffering
    location /api/scan/stream {
        proxy_pass https://aegis-backend-production-a4f9.up.railway.app/api/scan/stream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
